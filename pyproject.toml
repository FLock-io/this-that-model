[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thisthat"
version = "1.2.0"
description = "Typed decisions from a 2B model: one forward pass, no decoding, no parser."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Zehua Cheng" },
    { name = "Wei Dai" },
    { name = "Jiahao Sun" },
]
keywords = ["typed-decisions", "structured-output", "calibration", "inference", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The backbone runs on PyTorch everywhere and on MLX on Apple Silicon, and the marker picks one
# rather than making the caller pick: a CUDA box installs exactly what it did before, and a Mac
# stops downloading two gigabytes of PyTorch it was only ever going to use as a fallback. Either
# extra below forces the other backend in alongside; `thisthat.backends` names the command to run
# if a device is asked for that nothing is installed for.
dependencies = [
    "transformers>=4.57",
    "numpy>=1.24",
    "torch>=2.4; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
mlx = ["mlx-lm>=0.31.3"]
bench = ["numpy>=1.24"]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
# the parity test compares the two backends, so a dev install wants both of them
dev = ["pytest>=7.4", "ruff>=0.5", "httpx>=0.27", "openai>=1.40", "torch>=2.4"]

[project.urls]
Homepage = "https://huggingface.co/flock-io/this-that-model-1.2"
Dataset = "https://huggingface.co/datasets/limberc/this-that-spatial-bench"

[tool.setuptools.packages.find]
include = ["thisthat*", "benchmarks*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: regenerates an evaluation set from the simulator and scores it (minutes, not seconds)",
]
